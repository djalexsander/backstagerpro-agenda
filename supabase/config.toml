# This function authenticates scheduled calls with CHECK_VENCIMENTOS_SECRET
# inside the handler. Disabling the JWT gateway check allows pg_net to send
# that dedicated secret without storing a Supabase service-role credential.
[functions.check-vencimentos]
verify_jwt = false

[functions.self-register]
verify_jwt = false

[functions.request-account-activation]
verify_jwt = false

[functions.activate-account]
verify_jwt = false
